# Winlogbeat - a installer sur SRV-AD (Windows Server 2022), pas dans Docker.
# Fichier : C:\Program Files\Winlogbeat\winlogbeat.yml
# Il envoie vers Logstash publie par Docker sur SRV-LINUX (port 5045).
winlogbeat.event_logs:
  - name: Security
    event_id: 4624, 4625, 4634, 4647, 4648, 4720, 4722, 4725, 4726, 4728, 4732, 4740, 4767, 4768, 4769, 4771, 4776
    ignore_older: 72h
    fields:
      type_log: windows_security
      systeme: windows
  - name: System
    level: critical, error, warning
    ignore_older: 72h
    fields:
      type_log: windows_system
      systeme: windows

processors:
  - drop_event:
      when:
        regexp:
          winlog.event_data.TargetUserName: '.*\$$'
  - add_host_metadata: ~

output.logstash:
  hosts: ["srv-linux.labsecu.lan:5045"]

logging.level: info
logging.to_files: true
logging.files:
  path: C:\ProgramData\winlogbeat\Logs
  name: winlogbeat
  keepfiles: 7
