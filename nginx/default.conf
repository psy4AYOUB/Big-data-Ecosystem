# Site Web de test de SRV-LINUX. Les logs sont ecrits dans un volume lu par Filebeat.
server {
    listen 80 default_server;
    server_name srv-linux srv-linux.labsecu.lan _;

    access_log /var/log/labsecu-nginx/access.log combined;
    error_log  /var/log/labsecu-nginx/error.log warn;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
