# Schema commun puis envoi vers Kafka (topic security-logs)
filter {
  if [host][hostname] {
    mutate { add_field => { "[@metadata][hote]" => "%{[host][hostname]}" } }
  } else if [host][name] {
    mutate { add_field => { "[@metadata][hote]" => "%{[host][name]}" } }
  } else {
    mutate { add_field => { "[@metadata][hote]" => "inconnu" } }
  }
  mutate { remove_field => ["host"] }
  mutate { add_field => { "host" => "%{[@metadata][hote]}" } }
  mutate { lowercase => ["host"] }
  mutate { add_field => { "timestamp" => "%{@timestamp}" } }
  if ![severite]       { mutate { add_field => { "severite" => "info" } } }
  if ![type_evenement] { mutate { add_field => { "type_evenement" => "autre" } } }
  prune {
    whitelist_names => [
      "^@timestamp$", "^timestamp$", "^source$", "^host$", "^systeme$",
      "^type_evenement$", "^utilisateur$", "^adresse_ip$", "^message$", "^severite$",
      "^http_status$", "^http_method$", "^http_url$",
      "^port_source$", "^port_destination$", "^protocole$",
      "^event_id$", "^tags$"
    ]
  }
}

output {
  kafka {
    id                => "sortie_kafka_security_logs"
    bootstrap_servers => "kafka:9092"
    topic_id          => "security-logs"
    codec             => json
    message_key       => "%{host}"
  }
}
