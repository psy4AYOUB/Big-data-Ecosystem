# Normalisation des logs Linux : Nginx, SSH (auth.log) et pare-feu UFW
filter {
  if [systeme] == "linux" {

    # ------------------------------------------------------------ Nginx acces
    if [source] == "nginx_access" {
      grok {
        match => { "message" => [
          '^%{IPORHOST:adresse_ip} - %{DATA:utilisateur_http} \[%{HTTPDATE:log_time}\] "%{WORD:http_method} %{DATA:http_url} HTTP/%{NUMBER:http_version}" %{INT:http_status} %{INT:http_octets}',
          '^%{IPORHOST:adresse_ip} - %{DATA:utilisateur_http} \[%{HTTPDATE:log_time}\] "%{DATA:requete_brute}" %{INT:http_status} %{INT:http_octets}'
        ] }
      }
      date { match => ["log_time", "dd/MMM/yyyy:HH:mm:ss Z"] }
      mutate {
        convert   => { "http_status" => "integer" }
        add_field => { "port_destination" => "80" "protocole" => "http" }
      }
      if [http_status] and [http_status] >= 500 {
        mutate { add_field => { "type_evenement" => "http_erreur_5xx" "severite" => "medium" } }
      } else if [http_status] and [http_status] >= 400 {
        mutate { add_field => { "type_evenement" => "http_erreur_4xx" "severite" => "low" } }
      } else {
        mutate { add_field => { "type_evenement" => "http_acces" "severite" => "info" } }
      }
    }

    # ------------------------------------------------------------ Nginx erreurs
    else if [source] == "nginx_error" {
      grok {
        match => { "message" => '^%{DATA:log_time} \[%{LOGLEVEL:niveau}\]' }
        tag_on_failure => []
      }
      grok {
        match => { "message" => 'client: %{IP:adresse_ip}' }
        tag_on_failure => []
      }
      date { match => ["log_time", "yyyy/MM/dd HH:mm:ss"] }
      mutate { add_field => { "type_evenement" => "nginx_erreur" "severite" => "low" } }
    }

    # ------------------------------------------------------------ auth.log (SSH, sudo)
    else if [source] == "auth" {
      grok {
        match => { "message" => [
          '^%{TIMESTAMP_ISO8601:log_time} %{HOSTNAME:log_hote} %{DATA:programme}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_msg}$',
          '^%{SYSLOGTIMESTAMP:log_time} %{HOSTNAME:log_hote} %{DATA:programme}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_msg}$'
        ] }
      }
      date { match => ["log_time", "ISO8601", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] }

      if [programme] =~ /^sshd/ {
        grok {
          match => { "log_msg" => [
            '^Failed %{WORD:methode_auth} for invalid user %{DATA:utilisateur} from %{IP:adresse_ip} port %{INT:port_source}',
            '^Failed %{WORD:methode_auth} for %{DATA:utilisateur} from %{IP:adresse_ip} port %{INT:port_source}',
            '^Accepted %{WORD:methode_auth} for %{DATA:utilisateur} from %{IP:adresse_ip} port %{INT:port_source}',
            '^Invalid user %{DATA:utilisateur} from %{IP:adresse_ip}'
          ] }
          tag_on_failure => []
        }
        mutate { add_field => { "port_destination" => "22" "protocole" => "ssh" } }
        if [log_msg] =~ /^Failed / {
          mutate { add_field => { "type_evenement" => "ssh_echec" "severite" => "medium" } }
        } else if [log_msg] =~ /^Accepted / {
          mutate { add_field => { "type_evenement" => "ssh_succes" "severite" => "info" } }
        } else if [log_msg] =~ /^Invalid user / {
          mutate { add_field => { "type_evenement" => "ssh_utilisateur_invalide" "severite" => "low" } }
        } else {
          mutate { add_field => { "type_evenement" => "ssh_autre" "severite" => "info" } }
        }
      } else if [programme] == "sudo" {
        mutate { add_field => { "type_evenement" => "sudo" "severite" => "info" } }
      }
    }

    # ------------------------------------------------------------ Pare-feu UFW
    else if [source] == "firewall" {
      grok {
        match => { "message" => '^%{TIMESTAMP_ISO8601:log_time} .*\[UFW %{WORD:action_fw}\].* SRC=%{IP:adresse_ip} DST=%{IP:ip_destination}.* PROTO=%{WORD:protocole}(?: SPT=%{INT:port_source} DPT=%{INT:port_destination})?' }
      }
      date { match => ["log_time", "ISO8601"] }
      if [action_fw] == "BLOCK" {
        mutate { add_field => { "type_evenement" => "firewall_blocage" "severite" => "low" } }
      } else {
        mutate { add_field => { "type_evenement" => "firewall_autre" "severite" => "info" } }
      }
      mutate { lowercase => ["protocole"] }
    }
  }
}
