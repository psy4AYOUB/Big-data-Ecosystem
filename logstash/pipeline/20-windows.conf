# Normalisation des evenements Windows (Winlogbeat, journal Security de SRV-AD)
filter {
  if [systeme] == "windows" {

    if [event][code] {
      mutate { add_field => { "event_id" => "%{[event][code]}" } }
    }
    if [winlog][event_data][TargetUserName] {
      mutate { copy => { "[winlog][event_data][TargetUserName]" => "utilisateur" } }
    }
    if [winlog][event_data][IpAddress] {
      mutate { copy => { "[winlog][event_data][IpAddress]" => "adresse_ip" } }
      mutate { gsub => ["adresse_ip", "^::ffff:", ""] }
    }
    if [winlog][event_data][IpPort] {
      mutate { copy => { "[winlog][event_data][IpPort]" => "port_source" } }
    }
    if [adresse_ip] in ["-", ""] { mutate { remove_field => ["adresse_ip"] } }
    if [port_source] in ["-", "0", ""] { mutate { remove_field => ["port_source"] } }
    if [utilisateur] in ["-", ""] { mutate { remove_field => ["utilisateur"] } }
    if [utilisateur] { mutate { lowercase => ["utilisateur"] } }

    if [event_id] == "4624" {
      mutate { add_field => { "type_evenement" => "auth_succes" "severite" => "info" } }
    } else if [event_id] == "4625" {
      mutate { add_field => { "type_evenement" => "auth_echec" "severite" => "medium" } }
    } else if [event_id] == "4771" {
      mutate { add_field => { "type_evenement" => "kerberos_preauth_echec" "severite" => "medium" } }
    } else if [event_id] == "4776" {
      mutate { add_field => { "type_evenement" => "ntlm_validation" "severite" => "info" } }
    } else if [event_id] == "4740" {
      mutate { add_field => { "type_evenement" => "compte_verrouille" "severite" => "high" } }
    } else if [event_id] == "4767" {
      mutate { add_field => { "type_evenement" => "compte_deverrouille" "severite" => "info" } }
    } else if [event_id] in ["4720", "4722"] {
      mutate { add_field => { "type_evenement" => "compte_cree_active" "severite" => "medium" } }
    } else if [event_id] in ["4725", "4726"] {
      mutate { add_field => { "type_evenement" => "compte_desactive_supprime" "severite" => "medium" } }
    } else if [event_id] in ["4728", "4732"] {
      mutate { add_field => { "type_evenement" => "ajout_groupe" "severite" => "high" } }
    } else if [event_id] in ["4768", "4769"] {
      mutate { add_field => { "type_evenement" => "kerberos_ticket" "severite" => "info" } }
    } else if [event_id] in ["4634", "4647"] {
      mutate { add_field => { "type_evenement" => "fermeture_session" "severite" => "info" } }
    } else if [event_id] == "4648" {
      mutate { add_field => { "type_evenement" => "connexion_explicite" "severite" => "low" } }
    }
  }
}
