# =====================================================================
#  labsecu - Collecte et analyse des logs de securite (ISET Nabeul RSI 3)
#  Chaine : Nginx/SSH/UFW + Windows AD -> Filebeat/Winlogbeat -> Logstash
#           -> Kafka -> Spark Structured Streaming -> Cassandra + Elasticsearch
#           -> Kibana
#  A lancer sur SRV-LINUX (192.168.50.20). SRV-AD et KALI restent des VM.
# =====================================================================

name: labsecu

x-elastic-env: &elastic-env
  ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
  KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
  SPARK_ES_PASSWORD: ${SPARK_ES_PASSWORD}

services:

  # ---------------------------------------------------------------- sources
  nginx:
    image: nginx:stable
    container_name: labsecu-nginx
    hostname: srv-linux
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/labsecu-nginx

  # ---------------------------------------------------------------- collecte
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION}
    container_name: labsecu-filebeat
    hostname: srv-linux
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx_logs:/var/log/labsecu-nginx:ro
      - /var/log:/hostlog:ro            # auth.log (SSH) et ufw.log de SRV-LINUX
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_started

  # ---------------------------------------------------------------- normalisation
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: labsecu-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "5045:5045"                     # Winlogbeat de SRV-AD
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------- transport
  kafka:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: labsecu-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:${KAFKA_VERSION}
    container_name: labsecu-kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic security-logs --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic security-logs
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------- stockage
  cassandra:
    image: cassandra:${CASSANDRA_VERSION}
    container_name: labsecu-cassandra
    restart: unless-stopped
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
      CASSANDRA_CLUSTER_NAME: labsecu
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40

  cassandra-init:
    image: cassandra:${CASSANDRA_VERSION}
    container_name: labsecu-cassandra-init
    restart: "no"
    entrypoint: ["cqlsh", "cassandra", "-f", "/schema/schema.cql"]
    volumes:
      - ./cassandra/schema.cql:/schema/schema.cql:ro
    depends_on:
      cassandra:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: labsecu-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:9200:9200"           # accessible seulement depuis SRV-LINUX
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 40

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: labsecu-es-setup
    restart: "no"
    user: "0"
    environment: *elastic-env
    entrypoint: ["/bin/bash", "/setup/setup-es.sh"]
    volumes:
      - ./elasticsearch:/setup:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ---------------------------------------------------------------- visualisation
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: labsecu-kibana
    restart: unless-stopped
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PUBLICBASEURL: http://192.168.50.20:5601
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      I18N_LOCALE: fr-FR
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY}
    ports:
      - "5601:5601"
    depends_on:
      es-setup:
        condition: service_completed_successfully

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: labsecu-kibana-setup
    restart: "no"
    user: "0"
    environment: *elastic-env
    entrypoint: ["/bin/bash", "/setup/setup-kibana.sh"]
    volumes:
      - ./kibana:/setup:ro
    depends_on:
      kibana:
        condition: service_started

  # ---------------------------------------------------------------- traitement
  spark:
    build:
      context: ./spark
      args:
        SPARK_VERSION: ${SPARK_VERSION}
    image: labsecu/spark-securite:latest
    container_name: labsecu-spark
    restart: unless-stopped
    environment:
      SPARK_VERSION: ${SPARK_VERSION}
      ES_SPARK_VERSION: ${ES_SPARK_VERSION}
      CASSANDRA_CONNECTOR_VERSION: ${CASSANDRA_CONNECTOR_VERSION}
      KAFKA_SERVEURS: kafka:9092
      KAFKA_TOPIC: security-logs
      KAFKA_DEPART: earliest
      CASSANDRA_HOTE: cassandra
      ES_HOTE: elasticsearch
      ES_PORT: "9200"
      ES_UTILISATEUR: spark_es
      ES_MOT_DE_PASSE: ${SPARK_ES_PASSWORD}
    volumes:
      - spark_checkpoints:/checkpoints
      - spark_ivy:/opt/spark/ivy
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully
      es-setup:
        condition: service_completed_successfully

volumes:
  nginx_logs:
  filebeat_data:
  kafka_data:
  cassandra_data:
  es_data:
  spark_checkpoints:
  spark_ivy:
